<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Terra, ar, água e fogo por município: desmatamento, qualidade do ar, água para consumo humano e queimadas, com dados abertos." />
    <title>Elementar · Terra, ar, água e fogo</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, sem piscar.
      try {
        const tema = localStorage.getItem('tema')
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
